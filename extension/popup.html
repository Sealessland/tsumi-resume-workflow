<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>归档本次投递</h1>
  <p>请只在网页明确显示投递成功后提交。</p>
  <label>公司 <input id="company" autocomplete="organization"></label>
  <label>岗位 <input id="position"></label>
  <label>岗位链接 <input id="jobUrl" type="url"></label>
  <label>备注 <textarea id="note" placeholder="如：官网投递、内推人"></textarea></label>
  <label><input id="autoArchive" type="checkbox"> 页面出现明确“投递成功”提示后自动归档</label>
  <details><summary>连接设置</summary><label>本机桥接密钥 <input id="secret" type="password"></label></details>
  <button id="archive">确认成功并归档</button><output id="status"></output>
  <script src="popup.js"></script>
</body></html>
